name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
      - master
  workflow_run:
    workflows: ["Gameweek Auto-Update & Data Pipeline Sync"]
    types: [completed]
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: vijay-tmt
  SERVICE_NAME: apexfpl
  REGION: asia-south1

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Container Image
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "${IMAGE_URI}" -f deployment/Dockerfile .
          docker push "${IMAGE_URI}"

      - name: Deploy to Cloud Run
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${IMAGE_URI}" \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --update-env-vars PYTHONUNBUFFERED=1 \
            --quiet

      - name: Deploy to Firebase Hosting
        run: |
          cp deployment/firebase.json ./firebase.json
          cp deployment/.firebaserc ./.firebaserc
          npx -y firebase-tools deploy --only hosting:apex-fpl --project ${{ env.PROJECT_ID }} --non-interactive
          rm -f ./firebase.json ./.firebaserc

      - name: Prune Old Cloud Run Revisions & Images (Retain Previous 3)
        run: |
          echo "🧹 Cleaning up old Cloud Run revisions (retaining previous 3 versions)..."
          OLD_REVISIONS=$(gcloud run revisions list \
            --service ${{ env.SERVICE_NAME }} \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --format="value(metadata.name)" \
            --sort-by="~metadata.creationTimestamp" | tail -n +5)

          for REV in ${OLD_REVISIONS}; do
            if [ -n "${REV}" ]; then
              echo "Deleting inactive revision: ${REV}"
              gcloud run revisions delete "${REV}" \
                --project ${{ env.PROJECT_ID }} \
                --region ${{ env.REGION }} \
                --quiet || true
            fi
          done

          echo "🧹 Cleaning up old Artifact Registry container images..."
          REPO_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}"
          OLD_IMAGES=$(gcloud artifacts docker images list "${REPO_PATH}" \
            --format="value(DIGEST)" \
            --sort-by="~CREATE_TIME" 2>/dev/null | tail -n +9 || true)

          for DIGEST in ${OLD_IMAGES}; do
            if [ -n "${DIGEST}" ]; then
              echo "Deleting old container image: ${DIGEST}"
              gcloud artifacts docker images delete "${REPO_PATH}@${DIGEST}" \
                --delete-tags \
                --quiet || true
            fi
          done
